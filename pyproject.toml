[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evoctl"
version = "0.1.1"
description = "Linux control panel for Audient EVO audio interfaces"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Aleksey Khristolyubov" },
]
dependencies = [
    "PySide6>=6.8",
]

[project.scripts]
evoctl = "evoctl.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
